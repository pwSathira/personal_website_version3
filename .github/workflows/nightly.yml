# Rebuilds the site every night so the hero ground track uses a fresh TLE.
# Set the DEPLOY_HOOK_URL secret to a Cloudflare Pages or Vercel deploy hook.
name: Nightly rebuild
on:
  schedule:
    - cron: '17 10 * * *' # 02:17 / 03:17 Vancouver time
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then echo "DEPLOY_HOOK_URL not set"; exit 1; fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL"
